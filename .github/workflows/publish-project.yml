name: Standalone project publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-project.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Manoj-619/incident-zero
          ref: 72c95004414388c1b9ace4ae461551679f4a902f
          path: _source
          persist-credentials: false
      - name: Import reviewed project files
        run: |
          mkdir _import
          git -C _source archive HEAD | tar -x -C _import
          python scripts/import-project.py _import
          rm -rf _source _import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate numerical and API behavior
        run: |
          python -m venv /tmp/orbit-validation
          /tmp/orbit-validation/bin/pip install -r backend/requirements.lock
          /tmp/orbit-validation/bin/pip install --no-deps -e backend
          /tmp/orbit-validation/bin/ruff check backend
          /tmp/orbit-validation/bin/python -m pytest backend/tests -q
        env:
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UI and build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Install Chromium rendering tools
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real browser behavior and render the 3D showcase
        working-directory: frontend
        run: |
          node tests/browser-smoke.cjs
          node tests/render-readme.cjs
      - name: Package the animated orbital showcase
        run: |
          /tmp/orbit-validation/bin/pip install Pillow
          /tmp/orbit-validation/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          frames = [Image.open(p).convert("RGB").resize((960, 373), Image.Resampling.LANCZOS)
                    for p in sorted(Path("docs/assets/frames").glob("*.png"))]
          assert len(frames) == 60
          frames[0].save("docs/assets/orbit-3d.gif", save_all=True, append_images=frames[1:],
                         duration=110, loop=0, optimize=True)
          assert Path("docs/assets/hero-3d.png").stat().st_size > 10000
          assert Path("docs/assets/orbit-3d.gif").stat().st_size > 10000
          PY
          rm -rf docs/assets/frames
      - name: Verify containers and fresh mission approval
        run: |
          docker compose up --build -d --wait
          python scripts/smoke.py
          docker compose down
      - name: Validate standalone links and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path("README.md").read_text()
          assert "git clone https://github.com/Manoj-619/Orbit---Sentinal.git" in readme
          assert "incident-zero" not in readme
          for name in ["hero-3d.png", "orbit-3d.gif"]:
              assert Path("docs/assets", name).is_file()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          git commit -m "Publish orbital simulation and rendered mission showcase"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-showcase-and-browser-previews
          path: |
            docs/assets/hero-3d.png
            docs/assets/orbit-3d.gif
            frontend/browser-artifacts/
          if-no-files-found: ignore
      - name: Container cleanup
        if: always()
        run: docker compose down || true
