name: Orbital launch film
on:
  push:
    paths:
      - 'scripts/film-*'
      - 'frontend/tests/render-film.cjs'
      - '.github/workflows/launch-film.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy
          cd frontend
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run build
      - name: Render orbital cinematography
        working-directory: frontend
        run: node tests/render-film.cjs
      - name: Compose film and original soundtrack
        run: python scripts/film-compose.py
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Sentinal-LinkedIn-Film
          path: |
            film/Orbit_Sentinal_Launch_Film.mp4
            film/poster-*.jpg
            film/export-report.json
          retention-days: 90
          compression-level: 0
